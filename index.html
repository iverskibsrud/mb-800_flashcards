<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MB-800 Flashcards</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div>
        <h1>MB-800 Flashcards</h1>
        <p class="subtitle">Flashcards for review</p>
        </div>
        <button class="menu-toggle" id="menuToggle" type="button" aria-controls="categoryMenu" aria-expanded="false">
          <span class="menu-icon" aria-hidden="true">☰</span>
          <span>Categories</span>
        </button>
      </header>

      <aside class="category-menu" id="categoryMenu" aria-label="Filter by category" hidden>
        <div class="menu-heading">
          <div>
            <p class="menu-kicker">Study set</p>
            <h2>Choose categories</h2>
          </div>
          <button class="close-menu" id="closeMenu" type="button" aria-label="Close category menu">×</button>
        </div>
        <div class="category-actions">
          <button id="selectAllBtn" type="button">Select all</button>
          <button id="clearAllBtn" type="button">Clear all</button>
        </div>
        <div class="category-list" id="categoryList"></div>
      </aside>
      <div class="menu-backdrop" id="menuBackdrop" hidden></div>

      <section class="card" id="card" aria-live="polite">
        <p class="label" id="cardLabel">Question</p>
        <p class="content" id="cardContent">Loading…</p>
      </section>

      <section class="controls">
        <button id="prevBtn" type="button">Previous</button>
        <button id="flipBtn" type="button">Flip</button>
        <button id="nextBtn" type="button">Next</button>
        <button id="shuffleBtn" type="button">Shuffle</button>
      </section>

      <p class="meta" id="meta"></p>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
